name: aplicacion-diss

services:
  db:
    image: postgres:17-alpine
    container_name: diss_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citas_municipales}
      POSTGRES_USER: ${POSTGRES_USER:-citas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Santiago
      PGTZ: America/Santiago
    ports:
      # 5432 suele estar ocupado por un PostgreSQL local; se expone 5433 en el host.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: diss_backend
    environment:
      # Si DATABASE_URL está definida en .env, tiene prioridad. Si no, se usa
      # la base local del servicio db.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-citas_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citas_municipales}}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env}
      ENTORNO: ${ENTORNO:-desarrollo}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      DOCUMENTOS_DIR: /data/documentos
      MAX_DOCUMENTO_MB: ${MAX_DOCUMENTO_MB:-10}
      TZ: America/Santiago
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - documentos_data:/data/documentos
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: diss_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
      TZ: America/Santiago
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Conserva las dependencias instaladas dentro de la imagen.
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: diss_postgres_data
  documentos_data:
    name: diss_documentos_data
